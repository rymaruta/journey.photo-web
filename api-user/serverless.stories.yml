# ストーリー（見る・作る・返事・投票・質問・足あと・残す・期限切れの掃除。`src/stories.ts` ほか）とハイライト（`src/highlights.ts`）の口を、user API とは**別のスタック**で配る（札 journey.photo-ios#552 ②・owner 承認 2026-11-12「推奨で」）。
#
# 🔴 なぜ分けたか: user API のスタック（`serverless.yml`）の CloudFormation の部品が上限 500 に近かった（488）。
#    機能のまとまりごとに別のスタックへ移す（1つ目は共同アルバム `serverless.albums.yml`）。
#
# 🔴 口の URL は今の user API と同じ。新しい HTTP API は作らず、user API のスタックが書き出す HttpApiId を
#    取り込んで**経路だけ**このスタックに置く。ログインの確かめは user API が書き出す認可（`CognitoAuthorizerId`）を使う。
#    環境変数と既定の役の権限は user API と同じもの（下の provider）。このスタックを配るのは user API の**直後**（`deploy-api.yml`）。
#
# 🔴 戻すときは、**先にこのスタックを消して**（`aws cloudformation delete-stack --stack-name photo-gallery-stories-<stage>`）
#    から user API に戻す変更を流す（逆の順だと同じ経路がぶつかって user API の反映が落ちる）。
service: photo-gallery-stories

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1
  # user API と同じ（`scripts/__tests__/logRetention.test.ts`）
  logRetentionInDays: 90
  versionFunctions: false
  # 🔴 環境変数と既定の役（role を書かない関数）の権限は **user API の provider と同じ**にしてある
  #    （移す前と同じ環境で動かす。`scripts/__tests__/splitStacks.test.ts` が user API と突き合わせる）。
  #    user API の provider を変えたら、ここも同じに直す
  environment:
    # 環境ごとの値。既定値は置かない——未指定ならデプロイを失敗させる。
    # 以前はテーブル名がリテラルの prod-... で、--stage を変えても
    # 読み書き先が本番のままだった。
    UPLOAD_BUCKET: ${param:uploadBucket}
    CLOUDFRONT_URL: ${param:cloudfrontUrl}
    # 削除した実体をエッジからも消すための無効化先（LEFT-4）。
    # **未設定でも削除は成功する**（エッジの掃除だけ飛ばして警告を1行出す）
    # ——設定漏れで削除そのものを止めたくない。
    CLOUDFRONT_DISTRIBUTION_ID: ${param:cloudfrontDistributionId, ''}
    PHOTOS_TABLE: ${param:photosTable}
    USERS_TABLE: ${param:usersTable}
    # Pro の購入をどの環境から受けるか（`deploy-api.yml` が環境ごとに渡す。公開の値で秘密ではない）。
    # **全関数に配る**: プロフィール・メダルを返す関数も、Production も受けるサーバー（本番）では
    # Sandbox（TestFlight・審査）のサポーター番号を公開せず、メダルにしない（`supporter.ts` の
    # `isPrivateSandbox`）。購入の2関数だけに置くと、ほかの関数は Sandbox だけのサーバーと見なして公開する
    APPSTORE_ENVIRONMENTS: ${param:appStoreEnvironments, ''}
    # 再ビルド依頼の設定（REBUILD_*）はここには置かない。**GitHub の書き込み
    # トークンなので、provider に置くと全関数の環境変数に入る**（IAM-2）。
    # 実際に頼むのは api-user で3つ・api で2つだけなので、その関数にだけ配る。
  httpApi:
    id:
      Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-HttpApiId
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/profiles/*
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
            - dynamodb:DeleteItem
            # TransactWriteItems の ConditionCheck 項目に要る（Put/Update/Delete の
            # 項目はそれぞれの権限で足りるが、ConditionCheck だけ別の権限）。
            # `storyVotes.ts` が「行がまだ在ること」をこれで確かめる。
            # 無いと AccessDeniedException で**全部の票が 500** になる
            - dynamodb:ConditionCheckItem
            # user API の provider と同じ（`splitStacks.test.ts`）。共有した旅行プランの本体をまとめて読む分（2026-11-12）
            - dynamodb:BatchGetItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}/index/*
        # 期限切れストーリーの物理削除 / 退会時の写真・アバター・カバー削除用
        - Effect: Allow
          Action:
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/profiles/*
            # 公開範囲を絞った写真の置き場（`privateMove.ts`）。移したあとに
            # 元を消す・移した写真を削除や退会で消す、の両方に要る
            - arn:aws:s3:::${param:uploadBucket}/private/*
        # **絞った写真を `private/` へ移す**（`s3Move.ts` の CopyObject）。
        # CopyObject は「元の読み取り」と「先の書き込み」の両方が要る。
        # 2026-09-28 まで無く、本番では移動が必ず AccessDenied だった
        # （公開範囲をあとから変えると 500。`docs/restricted-image-delivery.md`）。
        # 戻す（絞りを外す）ときは逆向きなので、両方の置き場で読み書きする
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/private/*
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/private/*
        # 削除・退会・期限切れストーリーで消した実体を、エッジからも消す。
        # アップロードは max-age=31536000（1年）で配っているので、S3 から
        # 消すだけでは**URL を知っていれば取れ続ける**（GPS 入りの原本も同じ）。
        # 対象はこのアカウントの配信のみ。作成しかできない（読み書きは無い）。
        - Effect: Allow
          Action:
            - cloudfront:CreateInvalidation
          Resource:
            - arn:aws:cloudfront::${aws:accountId}:distribution/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            # ユーザー検索（表示名の部分一致）。ユーザー数が増えたら GSI に置き換える
            - dynamodb:Scan
            # 退会者の伏せ字（`notify.ts` の `deletedAmong`）。一覧に出る ID だけを
            # 100 件ずつ引く。無いと**全員が読めない**扱いになり、名前を写して持つ4つ
            # （コメント・通知・ストーリーの返信・閲覧者）は全員を伏せ、フォロー・
            # フォロワー・ブロックの一覧は全員を生きている扱いにする（名前は引き直すので漏れない）
            - dynamodb:BatchGetItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  getStories:
    handler: src/stories.getStories
    events:
      - httpApi:
          path: /stories
          method: GET
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  createStory:
    handler: src/stories.createStory
    # メンションの通知（`storymention`）を積む。**端末への送信は `notify.ts` の
    # `PUSH_READY_TYPES` に入れるまで止めてある**（古いアプリが鍵の文字をそのまま出すため）。
    # 鍵は入れる日に配り忘れないよう、今から配る（`apnsKeyScope.test.ts` が見張る）
    environment:
      # **プッシュの鍵は「送る関数」にだけ配る**（provider に置かない・IAM-2。`postStoryReply` と同じ）。
      # **未設定でも本筋は通る**（通知は積まれ、端末に飛ばないだけ）
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      APNS_PRIVATE_KEY: ${param:apnsPrivateKey, ''}
      APNS_TOPIC: ${param:apnsTopic, ''}
      APNS_HOST: ${param:apnsHost, ''}
    events:
      - httpApi:
          path: /stories
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  deleteStory:
    handler: src/stories.deleteStory
    events:
      - httpApi:
          path: /stories/{id}
          method: DELETE
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  viewStory:
    handler: src/stories.viewStory
    events:
      - httpApi:
          path: /stories/{id}/view
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  getStoryViewers:
    handler: src/stories.getStoryViewers
    events:
      - httpApi:
          path: /stories/{id}/viewers
          method: GET
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # ストーリーへの返信・リアクション。**どちらも認証必要**
  # （送る側はログイン、読めるのは投稿者だけ）。`PublicReadRole` には
  # 載せない——書き込みがあるので未認証の口の一覧に足してはいけない
  postStoryReply:
    handler: src/storyReplies.postStoryReply
    environment:
      # **プッシュの鍵は「送る関数」にだけ配る**（provider に置かない・IAM-2）。
      # 環境変数は lambda:GetFunctionConfiguration を持つ人に見えるので、
      # 未認証で呼べる口にまで秘密を配る理由は無い。
      # **未設定でも本筋は通る**（通知は積まれ、端末に飛ばないだけ）
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      APNS_PRIVATE_KEY: ${param:apnsPrivateKey, ''}
      APNS_TOPIC: ${param:apnsTopic, ''}
      APNS_HOST: ${param:apnsHost, ''}
    # 既定の6秒だと、件数の書き込みをやり直す回に枠を使い切りうる
    # （本文はもう入っているので、そこで切れると画面は失敗と読んで
    #  送り直し＝二重投稿になる）。`savePhoto` と同じ理由で広げる。
    timeout: 15
    events:
      - httpApi:
          path: /stories/{id}/replies
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  getStoryReplies:
    handler: src/storyReplies.getStoryReplies
    events:
      - httpApi:
          path: /stories/{id}/replies
          method: GET
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # 投票スタンプ（2択）に票を入れる。認証必要・1人1票。
  # 結果は `getStories` が投稿者と票を入れた人にだけ付けて返すので、
  # 読む口は別に置かない。`PublicReadRole` には載せない（書き込み）
  voteStory:
    handler: src/storyVotes.voteStory
    events:
      - httpApi:
          path: /stories/{id}/vote
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # 質問スタンプへの答え（札 #505）。答えは**投稿者だけ**が読める
  # （`GET` は投稿者以外に 403）。書き込みの口は `PublicReadRole` には載せない。
  # 答えは票の文書（`storyvotes#<id>`）の `answers` 列に置くので、
  # 新しいテーブルも GSI も要らない（`storyAnswers.ts` の節）。
  # `TransactWrite`（行の ConditionCheck）は `voteStory` と同じ共有ロールが持つ
  answerStory:
    handler: src/storyAnswers.answerStory
    timeout: 15
    environment:
      # **プッシュの鍵は「送る関数」にだけ配る**（provider に置かない・IAM-2。`postStoryReply` と同じ）。
      # **未設定でも本筋は通る**（通知は積まれ、端末に飛ばないだけ）
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      APNS_PRIVATE_KEY: ${param:apnsPrivateKey, ''}
      APNS_TOPIC: ${param:apnsTopic, ''}
      APNS_HOST: ${param:apnsHost, ''}
    events:
      - httpApi:
          path: /stories/{id}/answers
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  getStoryAnswers:
    handler: src/storyAnswers.getStoryAnswers
    events:
      - httpApi:
          path: /stories/{id}/answers
          method: GET
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # 答え1件の通報（投稿者だけ）。答えの全文を通報の行に写して残す
  reportStoryAnswer:
    handler: src/storyAnswers.reportStoryAnswer
    events:
      - httpApi:
          path: /stories/{id}/answers/{answerId}/report
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # ストーリーの1枚をギャラリーに残す（投稿者だけ）。
  # 作るのは**下書きの写真**なので、公開・再ビルドは既存の経路が受け持つ
  keepStory:
    handler: src/storyKeep.keepStory
    events:
      - httpApi:
          path: /stories/{id}/keep
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # 自分のアーカイブ（24時間で消えたあとも本人だけ見られる）。
  # `GET /stories/{id}` は無いので、この固定パスと取り違えることは無い
  getStoryArchive:
    handler: src/storyArchive.getStoryArchive
    events:
      - httpApi:
          path: /stories/archive
          method: GET
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # ---- ハイライト（⑦・アーカイブを束ねてマイページの輪に）------------
  # 作る・直す・消すは本人だけ。読む2つは未認証（マイページは誰でも見る）
  # ——読み取り専用ロール（写真テーブルは GetItem のみ）で動くよう、
  # `highlights.ts` は ID を1件ずつ引く形にしてある
  createHighlight:
    handler: src/highlights.createHighlight
    events:
      - httpApi:
          path: /highlights
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  updateHighlight:
    handler: src/highlights.updateHighlight
    events:
      - httpApi:
          path: /highlights/{id}
          method: PUT
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  deleteHighlight:
    handler: src/highlights.deleteHighlight
    events:
      - httpApi:
          path: /highlights/{id}
          method: DELETE
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # 🔴 **ログインが要る。さらに中でフォローとブロックを見る**（`canSeeHighlights`）。
  # ハイライトの中身はストーリーそのもので、**ストーリーはフォロワーだけが
  # 見る**（2026-09-22・owner の判断。経緯は `src/storyVisibility.ts`）。
  #
  # 最初この2つを未認証で開いた（マイページを誰でも見られるようにするため）。
  # 根拠は「入れられるのは全員に公開のアーカイブだけ」だったが、あの「全員」は
  # **ログインした全員**の意味で、インターネット全体ではなかった。
  # その状態で本番まで出した。
  #
  # **ブロックも見る**（2026-09-22・後から塞いだ）。ストーリーの門は他に4つ
  # （`getStories` / `viewStory` / `postStoryReply` / `voteStory`）あり、
  # **どれもブロックを見ている**のにここだけ見ていなかった。
  # 「ブロックすればフォローが切れる」は成り立たない——`block.ts` は
  # `unfollowQuietly` の失敗を握って「ブロックは成功」で返すので、
  # **フォローの印が残ったままブロックが成立する断面が設計として在る**。
  #
  # **`role: PublicReadRole` は付けない。** あれは「未認証で呼べる口」の目印で、
  # `scripts/__tests__/publicLambdaRole.test.ts` が「認可の無い口の集合」と
  # 突き合わせている。認可を付けた関数に残すと対応が崩れ、**新しい未認証の口が
  # 黙って共有ロールに乗る**のを見つけられなくなる。認証済みの読み取り口
  # （`getStoryViewers`・`getStoryReplies` など）は全部この共有ロール。
  getUserHighlights:
    handler: src/highlights.getUserHighlights
    events:
      - httpApi:
          path: /highlights/{userId}
          method: GET
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  getHighlight:
    handler: src/highlights.getHighlight
    events:
      - httpApi:
          path: /highlights/{userId}/{id}
          method: GET
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  cleanupStories:
    handler: src/stories.cleanupExpiredStories
    # S3 の削除は直列。6秒では完走できない（黙って途中で切れ、期限切れが
    # 消え残る）。索引ができて対象だけを引けるようになった今も、
    # 溜まっている回のために長めのまま残す。
    timeout: 300
    events:
      # **1時間ごと（旧: 毎日 04:00 JST）。**
      #
      # ストーリーは「24時間で消える」と言っているのに、掃除が1日1回
      # だったので**実体は最大およそ48時間ぶん公開URLで取れた**
      # ——期限が切れた直後に掃除が走ったばかりだと、次の掃除まで24時間。
      # 約束と実体の寿命が最大2倍ずれる（LEFT-5）。
      #
      # 日次にしていたのは、`queryStories` が索引の無いテーブルで
      # **全表 Scan にフォールバック**していたから（写真・コメント・
      # いいね/フォローのマーカーが同居していて、行は増える一方）。
      # 2026-09-01 に `storyFeed-expiresAt-index` を本番へ作ったので、
      # 期限切れのぶんだけを直接引ける。1時間ごとでも読む量は小さい。
      - schedule: cron(5 * * * ? *)

  # みんなの「行きたい」（`src/spotWants.ts`）の3つの関数は **別のスタック**（`serverless.spot-wants.yml`）。
  # このスタックの部品が上限 500 に近い（488）ため（2026-11-12）。口の URL は同じ（この HTTP API に経路だけ足す）

# ---------------------------------------------------------------------------
# 未認証で呼べる5つの口だけ、専用の最小ロールに分ける（IAM-1）
#
# 既定では **サービス内の全関数が1つのロールを共有する**ので、認証を
# 一度も通らない `getPublicProfile` / `searchUsers` / `getLikeCount` /
# `getComments` / `getFollowStats` が、写真テーブルの `DeleteItem` と
# `uploads/*`・`profiles/*` の `s3:DeleteObject`、CloudFront の
# `CreateInvalidation` まで持っていた。ハンドラのコードは使わないが、
# **これらの関数のどれか1つで任意コード実行に至る欠陥が出た瞬間、
# 認証の壁を一度も越えずに他人の写真の実体を消せる**。
#
# ここに書くのは「5つのハンドラが実際に叩いている API だけ」:
#
#   getPublicProfile  photos: GetItem / users: GetItem
#   searchUsers                 users: GetItem, Scan
#   getLikeCount      photos: GetItem
#   getComments       photos: GetItem / users: BatchGetItem（deletedAmong）
#   getFollowStats    photos: GetItem
#
# Query は1つも使っていない（全部 主キーの GetItem）。索引も引かないので
# index/* は付けない。**足すときは呼び出し側を数えてから**——ここを
# 「ついでに」広げると、分けた意味がそのぶん減る。
#
# プラグイン（serverless-iam-roles-per-function）は使わない。この環境から
# postinstall が取得できず入らなかったのと、依存を1つ増やすより
# CloudFormation を1つ書く方が読む人に見えるため。
