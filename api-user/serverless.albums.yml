# 共同アルバム（案C・`src/albums.ts`）の口を、user API とは**別のスタック**で配る
# （札 journey.photo-ios#552 ②・owner 承認 2026-11-12「推奨で」）。
#
# 🔴 なぜ分けたか: user API のスタック（`serverless.yml`）は CloudFormation の部品が 488 個で、上限 500 に近い。
#    機能のまとまりごとに別のスタックへ移す。共同アルバムは 8 関数・8 経路・部品 40 個（移すと user API は 448）。
#
# 🔴 口の URL は今の user API と同じ（`<user API>/albums...`・`/invites/...`）。新しい HTTP API は作らず、
#    user API のスタックが書き出す HttpApiId を取り込んで**経路だけ**このスタックに置く。
#    ログインの確かめは user API が書き出す認可（`CognitoAuthorizerId`）を使う（自分で認可を作らない・#552 ③）。
#    環境変数と既定の役の権限は user API と同じもの（下の provider）。
#    このスタックを配るのは user API の**後**（`deploy-api.yml`）。
#
# 🔴 移すときの止まり方: 同じ経路（方法＋道）を2つのスタックに同時に置けないので、移す反映は
#    「user API から外す → このスタックで作る」の順で、その間（1〜2 分）は 404 になる（staging で測った・#552）。
#    戻すときは、**先にこのスタックを消して**（`aws cloudformation delete-stack --stack-name photo-gallery-albums-<stage>`）
#    から user API に戻す変更を流す（逆の順だと同じ経路がぶつかって user API の反映が落ちる）。
service: photo-gallery-albums

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1
  # user API と同じ（`scripts/__tests__/logRetention.test.ts`）
  logRetentionInDays: 90
  versionFunctions: false
  # 🔴 環境変数と既定の役（role を書かない関数）の権限は **user API の provider と同じ**にしてある
  #    （移す前と同じ環境で動かす。`scripts/__tests__/splitStacks.test.ts` が user API と突き合わせる）。
  #    user API の provider を変えたら、ここも同じに直す
  environment:
    # 環境ごとの値。既定値は置かない——未指定ならデプロイを失敗させる。
    # 以前はテーブル名がリテラルの prod-... で、--stage を変えても
    # 読み書き先が本番のままだった。
    UPLOAD_BUCKET: ${param:uploadBucket}
    CLOUDFRONT_URL: ${param:cloudfrontUrl}
    # 削除した実体をエッジからも消すための無効化先（LEFT-4）。
    # **未設定でも削除は成功する**（エッジの掃除だけ飛ばして警告を1行出す）
    # ——設定漏れで削除そのものを止めたくない。
    CLOUDFRONT_DISTRIBUTION_ID: ${param:cloudfrontDistributionId, ''}
    PHOTOS_TABLE: ${param:photosTable}
    USERS_TABLE: ${param:usersTable}
    # Pro の購入をどの環境から受けるか（`deploy-api.yml` が環境ごとに渡す。公開の値で秘密ではない）。
    # **全関数に配る**: プロフィール・メダルを返す関数も、Production も受けるサーバー（本番）では
    # Sandbox（TestFlight・審査）のサポーター番号を公開せず、メダルにしない（`supporter.ts` の
    # `isPrivateSandbox`）。購入の2関数だけに置くと、ほかの関数は Sandbox だけのサーバーと見なして公開する
    APPSTORE_ENVIRONMENTS: ${param:appStoreEnvironments, ''}
    # 再ビルド依頼の設定（REBUILD_*）はここには置かない。**GitHub の書き込み
    # トークンなので、provider に置くと全関数の環境変数に入る**（IAM-2）。
    # 実際に頼むのは api-user で3つ・api で2つだけなので、その関数にだけ配る。
  httpApi:
    id:
      Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-HttpApiId
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/profiles/*
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
            - dynamodb:DeleteItem
            # TransactWriteItems の ConditionCheck 項目に要る（Put/Update/Delete の
            # 項目はそれぞれの権限で足りるが、ConditionCheck だけ別の権限）。
            # `storyVotes.ts` が「行がまだ在ること」をこれで確かめる。
            # 無いと AccessDeniedException で**全部の票が 500** になる
            - dynamodb:ConditionCheckItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}/index/*
        # 期限切れストーリーの物理削除 / 退会時の写真・アバター・カバー削除用
        - Effect: Allow
          Action:
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/profiles/*
            # 公開範囲を絞った写真の置き場（`privateMove.ts`）。移したあとに
            # 元を消す・移した写真を削除や退会で消す、の両方に要る
            - arn:aws:s3:::${param:uploadBucket}/private/*
        # **絞った写真を `private/` へ移す**（`s3Move.ts` の CopyObject）。
        # CopyObject は「元の読み取り」と「先の書き込み」の両方が要る。
        # 2026-09-28 まで無く、本番では移動が必ず AccessDenied だった
        # （公開範囲をあとから変えると 500。`docs/restricted-image-delivery.md`）。
        # 戻す（絞りを外す）ときは逆向きなので、両方の置き場で読み書きする
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/private/*
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/private/*
        # 削除・退会・期限切れストーリーで消した実体を、エッジからも消す。
        # アップロードは max-age=31536000（1年）で配っているので、S3 から
        # 消すだけでは**URL を知っていれば取れ続ける**（GPS 入りの原本も同じ）。
        # 対象はこのアカウントの配信のみ。作成しかできない（読み書きは無い）。
        - Effect: Allow
          Action:
            - cloudfront:CreateInvalidation
          Resource:
            - arn:aws:cloudfront::${aws:accountId}:distribution/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            # ユーザー検索（表示名の部分一致）。ユーザー数が増えたら GSI に置き換える
            - dynamodb:Scan
            # 退会者の伏せ字（`notify.ts` の `deletedAmong`）。一覧に出る ID だけを
            # 100 件ずつ引く。無いと**全員が読めない**扱いになり、名前を写して持つ4つ
            # （コメント・通知・ストーリーの返信・閲覧者）は全員を伏せ、フォロー・
            # フォロワー・ブロックの一覧は全員を生きている扱いにする（名前は引き直すので漏れない）
            - dynamodb:BatchGetItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  # 旅の同行者に招待リンクを1本配って、同じアルバムに写真を足してもらう。
  # 判定は src/invite.ts（DynamoDB も HTTP も触らない層）にある。
  # 旅の同行者に招待リンクを1本配って、同じアルバムに写真を足してもらう。
  # 判定は src/invite.ts（DynamoDB も HTTP も触らない層）にある。

  createAlbum:
    handler: src/albums.createAlbum
    events:
      - httpApi:
          path: /albums
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  listAlbums:
    handler: src/albums.listAlbums
    events:
      - httpApi:
          path: /albums
          method: GET
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  renameAlbum:
    handler: src/albums.renameAlbum
    events:
      - httpApi:
          path: /albums/{id}
          method: PATCH
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # **写真は消さない。** 消すのは束ね方（アルバム・参加の印・招待リンク）。
  deleteAlbum:
    handler: src/albums.deleteAlbum
    events:
      - httpApi:
          path: /albums/{id}
          method: DELETE
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  createInvite:
    handler: src/albums.createInvite
    events:
      - httpApi:
          path: /albums/{id}/invite
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  revokeInvite:
    handler: src/albums.revokeInvite
    events:
      - httpApi:
          path: /albums/{id}/invite
          method: DELETE
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # 招待を受けて参加する。**ここはログインが要る**——閲覧は誰でも、
  # 参加はログイン。参加した人は自分のプロフィールを持ち、次の招待者になれる。
  joinAlbum:
    handler: src/albums.joinAlbum
    events:
      - httpApi:
          path: /invites/{token}/join
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # **未認証で読める口。** 招待を開いた瞬間にログインを求めると、
  # 拡散の輪がそこで切れる。既定の共有ロール（削除権つき）ではなく
  # 読み取り専用へ——この口は招待の行・アルバムの行・下見の写真の行を GetItem するだけ。
  # 役（`AlbumInviteReadRole`）は写真テーブルの GetItem とログだけ（user API の PublicReadRole より狭い。
  # `src/albums.ts` の `getInvite` と `getAlbum` が読むのは写真テーブルの GetCommand だけ）。
  getInvite:
    handler: src/albums.getInvite
    role: AlbumInviteReadRole
    events:
      - httpApi:
          path: /invites/{token}
          method: GET

resources:
  Resources:
    # 招待リンクの下見（`getInvite`・未認証）だけの役。写真テーブルの GetItem とログだけ
    AlbumInviteReadRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-inviteRead
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: albumInviteRead
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
