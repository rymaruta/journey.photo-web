# AI で旅行プランを作る口（札 journey.photo-ios#621・owner 承認 2026-11-15「いいよ、進めて」・`src/tripAi.ts`）と、
# AI に頼む（札 #652・owner 承認 2026-11-20「たのむ」。同じ口の `action: "ask"`）を、
# user API とは**別のスタック**で配る（札 #552 の決まり。user API に口を足さない）。
#
# - 口は POST /user/trip-ai の1つ。URL は user API と同じ（HttpApiId を取り込み、経路だけ置く）
# - ログインの確かめは user API が書き出す認可（`CognitoAuthorizerId`）を使う
# - provider（環境変数と既定の役の権限）は user API と同じにしてある（`splitStacks.test.ts` が突き合わせる）。
#   ただしこの口は**既定の役を使わず、自分の役（`TripAiRole`）で動く**:
#     - Bedrock の InvokeModel を、使うモデル（`tripAiConfig.ts` の `TRIP_AI_MODEL_ID`）の東京の ARN だけに
#     - photos 表は `aiuse#` の行の GetItem・UpdateItem だけ。users 表は退会の確かめの GetItem だけ
#   🔴 モデルを Claude Haiku 5.5（`jp.anthropic.claude-haiku-5-5`）に替えるときは、Resource を
#      jp. の推論プロファイル（arn:aws:bedrock:ap-northeast-1:${aws:accountId}:inference-profile/jp.anthropic.claude-haiku-5-5）と
#      東京・大阪のモデル（arn:aws:bedrock:ap-northeast-1::foundation-model/anthropic.claude-haiku-5-5、
#      arn:aws:bedrock:ap-northeast-3::foundation-model/anthropic.claude-haiku-5-5）に替える（owner 承認の4）
service: photo-gallery-trip-ai

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs26.x
  region: ap-northeast-1
  # user API と同じ（`scripts/__tests__/logRetention.test.ts`）
  logRetentionInDays: 90
  versionFunctions: false
  # 🔴 環境変数と既定の役（role を書かない関数）の権限は **user API の provider と同じ**にしてある
  #    （移す前と同じ環境で動かす。`scripts/__tests__/splitStacks.test.ts` が user API と突き合わせる）。
  #    user API の provider を変えたら、ここも同じに直す
  environment:
    # 環境ごとの値。既定値は置かない——未指定ならデプロイを失敗させる。
    # 以前はテーブル名がリテラルの prod-... で、--stage を変えても
    # 読み書き先が本番のままだった。
    UPLOAD_BUCKET: ${param:uploadBucket}
    CLOUDFRONT_URL: ${param:cloudfrontUrl}
    # 削除した実体をエッジからも消すための無効化先（LEFT-4）。
    # **未設定でも削除は成功する**（エッジの掃除だけ飛ばして警告を1行出す）
    # ——設定漏れで削除そのものを止めたくない。
    CLOUDFRONT_DISTRIBUTION_ID: ${param:cloudfrontDistributionId, ''}
    PHOTOS_TABLE: ${param:photosTable}
    USERS_TABLE: ${param:usersTable}
    # Pro の購入をどの環境から受けるか（`deploy-api.yml` が環境ごとに渡す。公開の値で秘密ではない）。
    # **全関数に配る**: プロフィール・メダルを返す関数も、Production も受けるサーバー（本番）では
    # Sandbox（TestFlight・審査）のサポーター番号を公開せず、メダルにしない（`supporter.ts` の
    # `isPrivateSandbox`）。購入の2関数だけに置くと、ほかの関数は Sandbox だけのサーバーと見なして公開する
    APPSTORE_ENVIRONMENTS: ${param:appStoreEnvironments, ''}
    # 再ビルド依頼の設定（REBUILD_*）はここには置かない。**GitHub の書き込み
    # トークンなので、provider に置くと全関数の環境変数に入る**（IAM-2）。
    # 実際に頼むのは api-user で3つ・api で2つだけなので、その関数にだけ配る。
  httpApi:
    id:
      Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-HttpApiId
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/profiles/*
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
            - dynamodb:DeleteItem
            # TransactWriteItems の ConditionCheck 項目に要る（Put/Update/Delete の
            # 項目はそれぞれの権限で足りるが、ConditionCheck だけ別の権限）。
            # `storyVotes.ts` が「行がまだ在ること」をこれで確かめる。
            # 無いと AccessDeniedException で**全部の票が 500** になる
            - dynamodb:ConditionCheckItem
            # user API の provider と同じ（`splitStacks.test.ts`）。共有した旅行プランの本体をまとめて読む分（2026-11-12）
            - dynamodb:BatchGetItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}/index/*
        # 期限切れストーリーの物理削除 / 退会時の写真・アバター・カバー削除用
        - Effect: Allow
          Action:
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/profiles/*
            # 公開範囲を絞った写真の置き場（`privateMove.ts`）。移したあとに
            # 元を消す・移した写真を削除や退会で消す、の両方に要る
            - arn:aws:s3:::${param:uploadBucket}/private/*
        # **絞った写真を `private/` へ移す**（`s3Move.ts` の CopyObject）。
        # CopyObject は「元の読み取り」と「先の書き込み」の両方が要る。
        # 2026-09-28 まで無く、本番では移動が必ず AccessDenied だった
        # （公開範囲をあとから変えると 500。`docs/restricted-image-delivery.md`）。
        # 戻す（絞りを外す）ときは逆向きなので、両方の置き場で読み書きする
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/private/*
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/private/*
        # 削除・退会・期限切れストーリーで消した実体を、エッジからも消す。
        # アップロードは max-age=31536000（1年）で配っているので、S3 から
        # 消すだけでは**URL を知っていれば取れ続ける**（GPS 入りの原本も同じ）。
        # 対象はこのアカウントの配信のみ。作成しかできない（読み書きは無い）。
        - Effect: Allow
          Action:
            - cloudfront:CreateInvalidation
          Resource:
            - arn:aws:cloudfront::${aws:accountId}:distribution/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            # ユーザー検索（表示名の部分一致）。ユーザー数が増えたら GSI に置き換える
            - dynamodb:Scan
            # 退会者の伏せ字（`notify.ts` の `deletedAmong`）。一覧に出る ID だけを
            # 100 件ずつ引く。無いと**全員が読めない**扱いになり、名前を写して持つ4つ
            # （コメント・通知・ストーリーの返信・閲覧者）は全員を伏せ、フォロー・
            # フォロワー・ブロックの一覧は全員を生きている扱いにする（名前は引き直すので漏れない）
            - dynamodb:BatchGetItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node26
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  # AI で旅行プランを作る・AI に頼む・日と月の回数を返す・端末の AI の回を数える（体の `action` で分ける）
  tripAi:
    handler: src/tripAi.handler
    role: TripAiRole
    # 30件の試験で1回 約1.8秒（Nova Lite・2026-11-15）。遅い回の余裕を見て 25秒
    timeout: 25
    memorySize: 256
    events:
      - httpApi:
          path: /user/trip-ai
          method: POST
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

resources:
  Resources:
    TripAiRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-tripAi
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: tripAi
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                # 使うモデルの東京の ARN だけ（`tripAiConfig.ts` の TRIP_AI_MODEL_ID と同じ）
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                  Resource:
                    - arn:aws:bedrock:ap-northeast-1::foundation-model/amazon.nova-lite-v1:0
                # 回数の行（`aiuse#`）だけ読み書きする。利用者ごとの行と、全体の止めの行（`aiuse#all#<年月>`・`aiuse#all#<年月日>`。
                # 札 #652・`src/aiQuota.ts`）の両方がこの頭
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
                  Condition:
                    ForAllValues:StringLike:
                      dynamodb:LeadingKeys:
                        - aiuse#*
                # 退会の確かめと Pro の確かめ（`readLiveCaller`）。users の行を読むだけ
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}
