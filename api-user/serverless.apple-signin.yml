# 外のアカウントでのサインイン（「Apple でサインイン」・札 journey.photo-ios#601・2026-11-23 owner「すすめたい！」。
# 次に Google・#715）の口と Cognito のトリガー（`src/appleSignin.ts`・`src/appleAuthTrigger.ts`・土台は `src/federatedAccount.ts`）を、
# user API とは**別のスタック**で配る（CLAUDE.md「サーバーの口は機能ごとのスタックに足す」・札 #552）。
#
# 作りは `serverless.profile-qr.yml` と同じ:
#   - 新しい HTTP API は作らず、user API が書き出す HttpApiId を取り込んで**経路だけ**足す（URL は user API と同じ）
#
# 🔴 **このスタックを配ると、本番の Cognito のプールが変わる**（トリガー3つ: Define・Create・Verify）。
#    owner の承認が要る設定変更。`deploy-api.yml` は**リポジトリの変数 `APPLE_SIGNIN_ENABLED` が `true` のときだけ**
#    このスタックを配る（既定は配らない）。鍵（APNs の鍵に Sign in with Apple を足したもの・2026-11-23 owner）は
#    もうあるので、鍵の有無では決めない。
#    もう1つ、アプリのクライアントに `ALLOW_CUSTOM_AUTH` を足す変更は CloudFormation の外にある
#    （クライアントはこの仕組みで作っていない）。手順は iOS の `docs/APPLE_SIGNIN.md`。
#
# 🔴 トリガーは**1つの関数**で3つ受ける（`src/appleAuthTrigger.ts` の注記）。serverless の
#    `existing: true` は関数ごとにプールを `UpdateUserPool` で書き換え、**ほかの関数のトリガー
#    （PostConfirmation・photo-gallery-api）は残す**（その関数の ARN の項目だけ入れ替える）。
#    それでもプールのほかの設定が戻らないかは、付ける前後に `describe-user-pool` を比べる（手順書）。
#
# 戻すとき（順番を守る・手順書）: アプリのクライアントから `ALLOW_CUSTOM_AUTH` を外す →
#    `APPLE_SIGNIN_ENABLED` を false に → `aws cloudformation delete-stack --stack-name photo-gallery-apple-signin-<stage>` →
#    `aws cognito-idp describe-user-pool` で LambdaConfig を見て、Define・Create・Verify が残っていたら外す（PostConfirmation は残す）。
service: photo-gallery-apple-signin

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1
  # user API と同じ（`scripts/__tests__/logRetention.test.ts`）
  logRetentionInDays: 90
  versionFunctions: false
  environment:
    # `dynamodb.ts` が読み込みのときに要る（写真の表は読み書きしない）
    PHOTOS_TABLE: ${param:photosTable}
    USERS_TABLE: ${param:usersTable}
    # 宛先（Bundle ID。identity token の `aud`）。本番 `com.journeyphoto.JourneyPhoto`（staging の App ID は無い）。
    # 秘密ではない（APNs の topic と同じ値・`deploy-api.yml`）
    APPLE_SIGNIN_CLIENT_ID: ${param:appleSigninClientId, ''}
  httpApi:
    # user API の HTTP API に経路を足す（新しい API は作らない）
    id:
      Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-HttpApiId

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  # 使えるか。**未認証で呼べる口。** アプリは `available: true` のときだけボタンを出す。
  # 🔴 **環境変数に鍵を置かない。** 鍵を SSM に置く形（本線）では、SSM から読めるかを見て真偽だけ返す。
  #    環境変数に置く形では、`deploy-api.yml` が「そろっているか」の真偽（`appleSigninReady`）だけを渡す
  appleSigninStatus:
    handler: src/appleSignin.getAppleSigninStatus
    role: AppleStatusRole
    environment:
      APPLE_SIGNIN_READY: ${param:appleSigninReady, 'false'}
      APPLE_SIGNIN_KEY_PARAM: ${param:appleSigninKeyParam, ''}
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      COGNITO_USER_POOL_ID: ${param:cognitoUserPoolId}
    events:
      - httpApi:
          path: /auth/apple/status
          method: GET

  # identity token と元の nonce を確かめ、Cognito の利用者に結び（無ければ作る）、使い捨ての券を返す。**未認証で呼べる口。**
  # 守りは Apple の署名（このアプリの Bundle ID あての、期限内の token）・nonce の照らし（1回きり）・
  # 流量（user API の段の `POST /auth/apple`。秒 5 件）
  appleSigninStart:
    handler: src/appleSignin.startAppleSignin
    role: AppleSigninRole
    # Apple の公開鍵・認可コードの交換（それぞれ最大5秒）と Cognito の作成まで待つ
    timeout: 15
    environment:
      # 鍵は APNs の鍵（2026-11-23 owner）。Apple の client secret（認可コードの交換）に使う。置き場は `deploy-api.yml` の1か所
      # （`APPLE_SIGNIN_KEY_SOURCE`）で決まる: SSM（本線・`appleSigninKeyParam` に名前。環境変数の鍵は空）か、環境変数（`apnsPrivateKey`）
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      APNS_PRIVATE_KEY: ${param:apnsPrivateKey, ''}
      APPLE_SIGNIN_KEY_PARAM: ${param:appleSigninKeyParam, ''}
      # メールで自動で結んだときの知らせは、知らせだけの関数（下の `linkNotice`）に頼む（`federatedNoticeClient.ts`）
      FEDERATED_NOTICE_FUNCTION: ${self:service}-${sls:stage}-linkNotice
      COGNITO_USER_POOL_ID: ${param:cognitoUserPoolId}
    events:
      - httpApi:
          path: /auth/apple
          method: POST

  # 退会のときに Apple の更新トークンを取り消す（HTTP の口ではない）。user API の `deleteAccount` が呼ぶ
  # （`federatedRevokeClient.ts`。名前 `photo-gallery-apple-signin-<stage>-appleRevoke` を user API が知っている）。
  # 鍵を持つのはこのスタックだけ（user API には置かない）
  appleRevoke:
    handler: src/appleSignin.revokeTokenHandler
    role: AppleRevokeRole
    timeout: 10
    environment:
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      APNS_PRIVATE_KEY: ${param:apnsPrivateKey, ''}
      APPLE_SIGNIN_KEY_PARAM: ${param:appleSigninKeyParam, ''}

  # 「メールで自動で結んだ」知らせを持ち主の端末へ送る（HTTP の口ではない・`federatedNotice.ts`）。
  # Apple と Google のサインインの口が待たずに呼ぶ。🔴 知らせのプッシュの鍵（APNs の鍵）を持つのは、この中ではここだけ
  linkNotice:
    handler: src/federatedNotice.linkNoticeHandler
    role: LinkNoticeRole
    timeout: 10
    environment:
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      APNS_PRIVATE_KEY: ${param:apnsPrivateKey, ''}
      APPLE_SIGNIN_KEY_PARAM: ${param:appleSigninKeyParam, ''}
      APNS_TOPIC: ${param:apnsTopic, ''}
      APNS_HOST: ${param:apnsHost, ''}
      # メールでも知らせる（SES・2026-11-23 owner）。宛先は Cognito のそのアカウントのメール（sub で探す）。
      # 🔴 送るのは変数 `SIGNIN_EMAIL_ENABLED` が true の環境だけ（既定は送らない。SES の準備は iOS の `docs/APPLE_SIGNIN.md`）
      COGNITO_USER_POOL_ID: ${param:cognitoUserPoolId}
      SIGNIN_EMAIL_ENABLED: ${param:signinEmailEnabled, 'false'}
      SIGNIN_EMAIL_FROM: ${param:signinEmailFrom, 'no-reply@journey-photo.com'}

  # 「サインインの方法」（`src/signinMethods.ts`・2026-11-23 owner）。ログイン必須。本人が Apple・Google のつながりを外す。
  # 🔴 最後に残る入り方は外させない（409）。Apple の取り消しは鍵を持つ `appleRevoke` に頼む（この関数は鍵を持たない）。
  # 流量は user API の段の経路ごとの設定（`serverless.yml` の `AppleSigninOn`）
  signinMethodsList:
    handler: src/signinMethods.listSigninMethods
    # 読むだけの役（取り消しの関数は呼べない）
    role: SigninMethodsReadRole
    environment:
      COGNITO_USER_POOL_ID: ${param:cognitoUserPoolId}
    events:
      - httpApi:
          path: /user/signin-methods
          method: GET
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  signinMethodsRemove:
    handler: src/signinMethods.removeSigninMethod
    role: SigninMethodsRole
    # Apple の取り消し（`appleRevoke` は最大 10 秒）を待つ
    timeout: 15
    environment:
      COGNITO_USER_POOL_ID: ${param:cognitoUserPoolId}
      APPLE_REVOKE_FUNCTION: ${self:service}-${sls:stage}-appleRevoke
    events:
      - httpApi:
          path: /user/signin-methods/{provider}
          method: DELETE
          authorizer:
            type: jwt
            id:
              Fn::ImportValue: sls-photo-gallery-user-api-${sls:stage}-CognitoAuthorizerId

  # CUSTOM_AUTH のトリガー3つ（1つの関数）。鍵は持たない（券を照らして消すだけ）
  appleAuthChallenge:
    handler: src/appleAuthTrigger.handler
    role: AppleTriggerRole
    timeout: 10
    events:
      # ⚠️ existing: true は「既にあるプールを書き換える」。プール名を間違えると別環境のプールを書き換える。既定値は置かない
      - cognitoUserPool:
          pool: ${param:cognitoPoolName}
          trigger: DefineAuthChallenge
          existing: true
      - cognitoUserPool:
          pool: ${param:cognitoPoolName}
          trigger: CreateAuthChallenge
          existing: true
      - cognitoUserPool:
          pool: ${param:cognitoPoolName}
          trigger: VerifyAuthChallengeResponse
          existing: true

resources:
  Conditions:
    HasAlarmTopic:
      Fn::Not:
        - Fn::Equals: ["${param:alarmTopicArn, ''}", ""]
    # メールで知らせる（SES）。🔴 変数 `SIGNIN_EMAIL_ENABLED` が true のときだけ、SES の資格（ドメイン・DKIM）と送る権限を作る
    SigninEmailOn:
      Fn::Equals: ["${param:signinEmailEnabled, 'false'}", "true"]
    # 🔴 SES のドメインの登録はアカウントと地域で1つだけ（staging と本番は同じ AWS アカウントの東京）。2つのスタックで作ると
    #    後から配る方が落ちるので、**本番のスタックだけが作る**。staging は本番が作った登録を使う（送る権限は両方に付ける）
    SigninEmailIdentityOn:
      Fn::And:
        - Condition: SigninEmailOn
        - Fn::Equals: ["${sls:stage}", "prod"]
  Outputs:
    # DKIM の DNS に入れる CNAME（3組）。owner が DNS に入れる（手順は iOS の `docs/APPLE_SIGNIN.md`）
    SigninEmailDkim1:
      Condition: SigninEmailIdentityOn
      Value:
        Fn::Join: [" CNAME ", [{ "Fn::GetAtt": [SigninEmailIdentity, DkimDNSTokenName1] }, { "Fn::GetAtt": [SigninEmailIdentity, DkimDNSTokenValue1] }]]
    SigninEmailDkim2:
      Condition: SigninEmailIdentityOn
      Value:
        Fn::Join: [" CNAME ", [{ "Fn::GetAtt": [SigninEmailIdentity, DkimDNSTokenName2] }, { "Fn::GetAtt": [SigninEmailIdentity, DkimDNSTokenValue2] }]]
    SigninEmailDkim3:
      Condition: SigninEmailIdentityOn
      Value:
        Fn::Join: [" CNAME ", [{ "Fn::GetAtt": [SigninEmailIdentity, DkimDNSTokenName3] }, { "Fn::GetAtt": [SigninEmailIdentity, DkimDNSTokenValue3] }]]
  Resources:
    # SES の資格（送り元のドメイン）と DKIM（2026-11-23 owner「メールで知らせる」）。ドメインの確かめは DKIM の CNAME を DNS に
    # 入れると済む。🔴 送れる宛先の制限（サンドボックス）を外す申請は CloudFormation の外（手順書）
    SigninEmailIdentity:
      Type: AWS::SES::EmailIdentity
      Condition: SigninEmailIdentityOn
      Properties:
        EmailIdentity: ${param:signinEmailDomain, 'journey-photo.com'}
        DkimSigningAttributes:
          NextSigningKeyLength: RSA_2048_BIT

    # 「サインインの方法」の一覧（読むだけ）。users 表を読み、メールを見るため Cognito を sub で探すだけ
    SigninMethodsReadRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-methods-read
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: signinMethodsRead
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}
                - Effect: Allow
                  Action:
                    - cognito-idp:ListUsers
                  Resource: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${param:cognitoUserPoolId}

    # 「サインインの方法」の解除（`signinMethodsRemove` だけが使う）。users 表のプロフィールと `apple#`・`google#` の行を読み書きし、
    # メールを見るため Cognito を sub で探し、Apple の取り消しを `appleRevoke` に頼むだけ
    SigninMethodsRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-methods
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: signinMethods
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}
                - Effect: Allow
                  Action:
                    - cognito-idp:ListUsers
                  Resource: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${param:cognitoUserPoolId}
                # 🔴 鍵はこの関数に置かない。取り消しは鍵を持つ関数に頼む（退会のほかに呼べるのはここだけ。
                #    2026-11-23 owner の決定「Apple の取り消しをしてから連携を解除」・`appleRevokeInvokeScope.test.ts`）
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-appleRevoke

    # 使えるかを返すだけ。何も読まない
    AppleStatusRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-status
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: appleSigninStatus
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                # 鍵を SSM に置いたとき、読めるかを見る（答えは真偽だけ）
                - Effect: Allow
                  Action:
                    - ssm:GetParameter
                  Resource:
                    - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/journey-photo/${sls:stage}/apple-signin/*

    # 知らせの関数。端末（`devices#<uid>`）を読み、鍵（SSM）を読んで APNs に送るだけ
    LinkNoticeRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-notice
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: linkNotice
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
                  Condition:
                    ForAllValues:StringLike:
                      dynamodb:LeadingKeys:
                        - devices#*
                - Effect: Allow
                  Action:
                    - ssm:GetParameter
                  Resource:
                    - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/journey-photo/${sls:stage}/apple-signin/*
                # メールの宛先（そのアカウントのメール）を sub で探す
                - Effect: Allow
                  Action:
                    - cognito-idp:ListUsers
                  Resource: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${param:cognitoUserPoolId}
                # 🔴 メールを送るのは、決めた送り元からだけ（SES を作る環境だけ）
                - Fn::If:
                    - SigninEmailOn
                    - Effect: Allow
                      Action:
                        - ses:SendEmail
                      Resource:
                        - arn:aws:ses:${aws:region}:${aws:accountId}:identity/${param:signinEmailDomain, 'journey-photo.com'}
                      Condition:
                        StringEquals:
                          ses:FromAddress: ${param:signinEmailFrom, 'no-reply@journey-photo.com'}
                    - Ref: AWS::NoValue

    # 🔴 退会の取り消しの関数が落ち続けたら知らせる（2026-11-23 確かめ役の3回目）。落ちると退会は 500 で止まる（やり直しで通る）が、
    # 続くなら鍵や Apple の側がおかしい。15 分の間に3回以上落ちた 5 分の枠が2つ続いたら鳴る。
    # 知らせ先（SNS の宛先）はまだ無いので `alarmTopicArn` を渡したときだけ付ける（無ければ CloudWatch の画面に赤く出るだけ）
    AppleRevokeErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-appleRevoke-errors
        AlarmDescription: Apple の更新トークンの取り消し（退会）の関数が落ち続けている。退会が止まっている（札 journey.photo-ios#601）
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: ${self:service}-${sls:stage}-appleRevoke
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 3
        DatapointsToAlarm: 2
        Threshold: 3
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If:
            - HasAlarmTopic
            - ["${param:alarmTopicArn, ''}"]
            - Ref: AWS::NoValue

    # 取り消しの関数。鍵（SSM）を読み、Apple に頼むだけ（表も Cognito も触らない）
    AppleRevokeRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-revoke
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: appleRevoke
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - ssm:GetParameter
                  Resource:
                    - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/journey-photo/${sls:stage}/apple-signin/*

    # 結ぶ・作る口。users 表の読み書きと、このプールの利用者の作成・検索・作りかけの削除だけ
    AppleSigninRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-signin
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: appleSignin
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                # `apple#<sub>`・`nonce#apple#…` の行と、プロフィールの行（`appleSub`・初回の表示名）
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}
                # 知らせを送る端末（`devices#<uid>` を読むだけ）
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
                  Condition:
                    ForAllValues:StringLike:
                      dynamodb:LeadingKeys:
                        - devices#*
                # 鍵を SSM の SecureString に置いたとき（`appleSigninKeyParam`）。この道の下だけ読める
                - Effect: Allow
                  Action:
                    - ssm:GetParameter
                  Resource:
                    - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/journey-photo/${sls:stage}/apple-signin/*
                # 🔴 グループは `user` だけ入れる（`admin` に入れる道を持たせないのはハンドラ側の固定値。IAM は GroupName を絞れない）
                - Effect: Allow
                  Action:
                    - cognito-idp:ListUsers
                    - cognito-idp:AdminGetUser
                    - cognito-idp:AdminCreateUser
                    - cognito-idp:AdminSetUserPassword
                    - cognito-idp:AdminAddUserToGroup
                    # 🔴 `admin` の人にはメールで自動で結ばない（見るだけ）
                    - cognito-idp:AdminListGroupsForUser
                    # 作りかけ・結べなかった利用者を残さない（自分が作った利用者だけ消す。ハンドラ側の決まり）
                    - cognito-idp:AdminDeleteUser
                  Resource: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${param:cognitoUserPoolId}

    # トリガー。`apple#<sub>`・`google#<sub>` の行の券を読んで消すだけ（Google でログイン・#715 も同じトリガー）
    AppleTriggerRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-trigger
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: appleAuthTrigger
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}
                  Condition:
                    ForAllValues:StringLike:
                      dynamodb:LeadingKeys:
                        - apple#*
                        - google#*
