name: Collect world spot candidates

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Country slot (0-47)
        required: true
        default: '0'
        type: string
      offset:
        description: Pagination offset
        required: true
        default: '0'
        type: string
  schedule:
    # 1日1回（02:20 JST）。5分ごと（1日288回・月 約8,600分）は Actions の枠を超えて
    # owner の請求になるので止めた（rymaruta/journey.photo-ios#410・2026-11-04）。
    # 翌朝の prepare-daily-world-spots（03:00 JST）が直近26時間の結果を拾う。
    - cron: '20 17 * * *'
  pull_request:
    paths:
      - 'scripts/import_world_spots.py'
      - '.github/workflows/import-world-spots.yml'

permissions:
  contents: read

concurrency:
  group: world-spot-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate script
        run: python -m py_compile scripts/import_world_spots.py
      - name: Fetch world spots
        env:
          EVENT: ${{ github.event_name }}
          SLOT_INPUT: ${{ inputs.slot || '0' }}
          OFFSET_INPUT: ${{ inputs.offset || '0' }}
        run: |
          python - <<'PY'
          import os, subprocess
          from datetime import datetime, timezone
          event = os.environ["EVENT"]
          if event == "schedule":
              # 1日に1か国ずつ、48か国を回る。48日で一周したら次の 250 件へ進む。
              tick = int(datetime.now(timezone.utc).timestamp()) // 86400
              slot = tick % 48
              offset = ((tick // 48) % 20) * 250
          elif event == "pull_request":
              slot, offset = 0, 0
          else:
              slot, offset = int(os.environ["SLOT_INPUT"]), int(os.environ["OFFSET_INPUT"])
          if not 0 <= slot < 48 or not 0 <= offset <= 100000:
              raise SystemExit("invalid slot or offset")
          subprocess.run(["python", "scripts/import_world_spots.py", "--slot", str(slot),
                          "--offset", str(offset), "--limit", "250"], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: world-spot-candidates-${{ github.run_id }}
          path: data/imports/world/*.json
          if-no-files-found: error
          retention-days: 30
