name: Checks

# PRの作成・更新時と develop への反映時に自動で型・lint・テストを確認する。
# Actions使用量を抑えるため、変更対象を限定し、同じPRの古い実行をキャンセルする。
# 手動実行も残す。デプロイはこのワークフローでは行わない。
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - "lib/**"
      - "content/**"
      - "scripts/**"
      - "public/**"
      - ".github/workflows/checks.yml"
      - "package.json"
      - "package-lock.json"
      - "api/package.json"
      - "api/package-lock.json"
      - "api-user/package.json"
      - "api-user/package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "vitest.setup.ts"
  push:
    branches: [develop]
    paths:
      - "app/**"
      - "lib/**"
      - "content/**"
      - "scripts/**"
      - "public/**"
      - ".github/workflows/checks.yml"
      - "package.json"
      - "package-lock.json"
      - "api/package.json"
      - "api/package-lock.json"
      - "api-user/package.json"
      - "api-user/package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "vitest.setup.ts"

# 同じブランチに連続で push したら、古い方は打ち切る（枠を無駄にしない）。
# デプロイと違って途中で止めても困らない検査なので cancel-in-progress: true。
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型・lint・テスト
    runs-on: ubuntu-latest
    # **`deploy.yml` と同じ理由で上げた。** 全スイートは CI で約9〜10分
    # （実測: Deploy Site の `Run tests` が 2026-09-12 に 8分59秒、
    # 2026-09-13 に 10分の上限で打ち切られた）。install・tsc・eslint を
    # 足すと 15分では足りない。上限の目的（ハングを止める）は 25分でも残る。
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # **`tsc` は TypeScript 7**（2026-11-25）。`typescript` の名前は TypeScript 6（`@typescript/typescript6`）で、
      # typescript-eslint が使う JS の API と、next build の型の検査（`tsc6`）はこちら。`tsc` の名前は 7（`@typescript/native`）が持つ。
      # 7 が JS の API を持つ（7.1 の予定）まで、この2本立てにする（公式ブログの形）
      - name: Typecheck
        run: npx tsc --noEmit

      # **api・api-user の部品の PR（dependabot など）もここで確かめる。** Deploy API は develop に
      # 入ってから走るので、PR の段で型を見るのはここだけ。それぞれの依存を入れて、出荷と同じ版で見る
      - name: Install backend dependencies
        if: success() || failure()
        run: |
          npm ci --ignore-scripts --prefix api
          npm ci --ignore-scripts --prefix api-user

      - name: Typecheck backend
        if: success() || failure()
        run: |
          npx tsc -p api
          npx tsc -p api-user

      # 型エラーがあっても残りの問題を同じ実行で洗い出す。
      - name: Lint
        if: success() || failure()
        run: npx eslint .

      - name: Test
        if: success() || failure()
        run: npx vitest run
